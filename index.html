<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#09436a"
    >

    <title>Lauter Macher</title>

    <!-- v=2 zwingt den Browser, die neue CSS-Version zu laden -->
    <link
        rel="stylesheet"
        href="style.css?v=2"
    >
</head>


<body>

    <!-- =====================================
         STARTSEITE
         ===================================== -->

    <main
        id="homeScreen"
        class="screen home-screen"
    >

        <img
            src="./Logo_LM.png?v=2"
            alt="Lauter Macher Logo"
            class="logo"
        >

        <h1>
            Lauter Macher
        </h1>

        <p class="subtitle">
            Schülerfirma
        </p>


        <div class="home-buttons">

            <button
                id="saleButton"
                class="main-button sale-main-button"
            >
                🛒 Verkauf
            </button>


            <button
                id="adminButton"
                class="main-button admin-main-button"
            >
                ⚙️ Admin
            </button>

        </div>

    </main>


    <!-- =====================================
         VERKAUF
         ===================================== -->

    <main
        id="saleScreen"
        class="screen sale-screen"
    >

        <header class="screen-header">

            <button
                id="saleBackButton"
                class="back-button"
            >
                ← Zurück
            </button>

            <h1>
                🛒 Verkauf
            </h1>

        </header>


        <!-- GETRÄNKE -->

        <section class="product-section">

            <div class="section-title">

                <span class="section-icon">
                    🥤
                </span>

                <h2>
                    Getränke
                </h2>

            </div>


            <div
                id="drinksGrid"
                class="product-grid"
            >
            </div>

        </section>


        <!-- BÄCKEREI -->

        <section class="product-section">

            <div class="section-title">

                <span class="section-icon">
                    🥨
                </span>

                <h2>
                    Bäckerei
                </h2>

            </div>


            <div
                id="bakeryGrid"
                class="product-grid"
            >
            </div>

        </section>


        <!-- WARENKORB -->

        <section class="cart-section">

            <div class="section-title">

                <span class="section-icon">
                    🛒
                </span>

                <h2>
                    Warenkorb
                </h2>

            </div>


            <div
                id="cartItems"
                class="cart-items"
            >
            </div>


            <div class="cart-total">

                <span>
                    Gesamt
                </span>

                <strong id="cartTotal">
                    0,00 €
                </strong>

            </div>


            <button
                id="payButton"
                class="pay-button"
                disabled
            >
                💰 Bezahlen
            </button>

        </section>

    </main>


    <!-- =====================================
         BEZAHLEN
         ===================================== -->

    <main
        id="paymentScreen"
        class="screen payment-screen"
    >

        <header class="screen-header">

            <button
                id="paymentBackButton"
                class="back-button"
            >
                ← Zurück
            </button>

            <h1>
                💰 Bezahlen
            </h1>

        </header>


        <section class="payment-container">

            <div class="payment-label">
                Zu zahlen
            </div>

            <div
                id="paymentTotal"
                class="payment-total"
            >
                0,00 €
            </div>


            <div class="payment-label">
                Kunde gibt
            </div>

            <div
                id="amountReceived"
                class="amount-received"
            >
                0,00 €
            </div>


            <div class="change-container">

                <span>
                    Rückgeld
                </span>

                <strong id="changeAmount">
                    0,00 €
                </strong>

            </div>


            <!-- TASTATUR -->

            <div class="payment-keypad">

                <button class="payment-key">
                    1
                </button>

                <button class="payment-key">
                    2
                </button>

                <button class="payment-key">
                    3
                </button>


                <button class="payment-key">
                    4
                </button>

                <button class="payment-key">
                    5
                </button>

                <button class="payment-key">
                    6
                </button>


                <button class="payment-key">
                    7
                </button>

                <button class="payment-key">
                    8
                </button>

                <button class="payment-key">
                    9
                </button>


                <button
                    class="payment-key decimal-key"
                >
                    ,
                </button>

                <button class="payment-key">
                    0
                </button>

                <button
                    id="deletePaymentButton"
                    class="payment-key delete-key"
                >
                    ⌫
                </button>

            </div>


            <button
                id="paidButton"
                class="paid-button"
                disabled
            >
                ✔ Bezahlt
            </button>

        </section>

    </main>


    <!-- =====================================
         ERFOLG
         ===================================== -->

    <main
        id="successScreen"
        class="screen success-screen"
    >

        <div class="success-content">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Zahlung erfolgreich!
            </h1>


            <p>
                Danke!
            </p>


            <div class="success-change">

                Rückgeld:

                <strong id="successChange">
                    0,00 €
                </strong>

            </div>


            <button
                id="newOrderButton"
                class="new-order-button"
            >
                🛒 Neue Bestellung
            </button>


            <button
                id="successHomeButton"
                class="secondary-button"
            >
                ← Startseite
            </button>

        </div>

    </main>


    <!-- =====================================
         ADMIN PIN MODAL
         ===================================== -->

    <div
        id="pinModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="pin-box">

            <button
                id="cancelButton"
                class="modal-close"
            >
                ×
            </button>


            <h2>
                🔐 Admin
            </h2>


            <p>
                PIN eingeben
            </p>


            <div
                id="pinDisplay"
                class="pin-display"
            >

                <span>○</span>
                <span>○</span>
                <span>○</span>
                <span>○</span>

            </div>


            <div class="pin-keypad">

                <button class="number-button">
                    1
                </button>

                <button class="number-button">
                    2
                </button>

                <button class="number-button">
                    3
                </button>


                <button class="number-button">
                    4
                </button>

                <button class="number-button">
                    5
                </button>

                <button class="number-button">
                    6
                </button>


                <button class="number-button">
                    7
                </button>

                <button class="number-button">
                    8
                </button>

                <button class="number-button">
                    9
                </button>


                <button class="empty-key">
                </button>

                <button class="number-button">
                    0
                </button>

                <button
                    id="deleteButton"
                    class="delete-key"
                >
                    ⌫
                </button>

            </div>


            <button
                id="confirmButton"
                class="pin-confirm"
            >
                OK
            </button>

        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="js/products.js"></script>

    <script src="app.js"></script>

</body>

</html>
