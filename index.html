<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Lauter Macher</title>
</head>

<body>

    <main class="home">

        <img
            src="Logo_LM.png"
            alt="Lauter Macher Logo"
            class="logo"
        >

        <h1>Lauter Macher</h1>

        <p>Schülerfirma</p>

        <button
            class="main-button sale-button"
            id="saleButton"
        >
            🛒 Verkauf
        </button>

        <button
            class="main-button admin-button"
            id="adminButton"
        >
            ⚙️ Admin
        </button>

    </main>


    <!-- ========================================
         ADMIN PIN POP-UP
         ======================================== -->

    <div
        class="modal"
        id="pinModal"
        aria-hidden="true"
    >

        <div class="pin-box">

            <h2>🔐 Admin</h2>

            <p>PIN eingeben</p>

            <div class="pin-display">

                <span id="pin1">○</span>
                <span id="pin2">○</span>
                <span id="pin3">○</span>
                <span id="pin4">○</span>

            </div>


            <div class="keypad">

                <button class="number-button">1</button>
                <button class="number-button">2</button>
                <button class="number-button">3</button>

                <button class="number-button">4</button>
                <button class="number-button">5</button>
                <button class="number-button">6</button>

                <button class="number-button">7</button>
                <button class="number-button">8</button>
                <button class="number-button">9</button>

                <button
                    class="empty-key"
                    aria-hidden="true"
                ></button>

                <button class="number-button">0</button>

                <button
                    class="delete-key"
                    id="deleteButton"
                >
                    ⌫
                </button>

            </div>


            <button
                class="pin-confirm"
                id="confirmButton"
            >
                OK
            </button>


            <button
                class="pin-cancel"
                id="cancelButton"
            >
                ← Zurück
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
