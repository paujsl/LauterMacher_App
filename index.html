<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Lauter Macher</title>
</head>

<body>

    <!-- ==============================
         STARTSEITE
         ============================== -->

    <main class="home">

        <img
            src="Logo_LM.png"
            alt="Lauter Macher Logo"
            class="logo"
        >

        <h1>Lauter Macher</h1>

        <p>Schülerfirma</p>


        <!-- VERKAUF -->

        <button class="main-button sale-button">
            🛒 Verkauf
        </button>


        <!-- ADMIN -->

        <button class="main-button admin-button" id="adminButton">
            ⚙️ Admin
        </button>

    </main>


    <!-- ==============================
         ADMIN PIN - POP-UP
         ============================== -->

    <div class="modal" id="pinModal">

        <div class="pin-box">

            <h2>🔐 Admin</h2>

            <p>PIN eingeben</p>


            <!-- PIN ANZEIGE -->

            <div class="pin-display">

                <span id="pin1">○</span>
                <span id="pin2">○</span>
                <span id="pin3">○</span>
                <span id="pin4">○</span>

            </div>


            <!-- NUMERISCHES TASTENFELD -->

            <div class="keypad">

                <button class="number-button">1</button>
                <button class="number-button">2</button>
                <button class="number-button">3</button>

                <button class="number-button">4</button>
                <button class="number-button">5</button>
                <button class="number-button">6</button>

                <button class="number-button">7</button>
                <button class="number-button">8</button>
                <button class="number-button">9</button>

                <button class="empty-key"></button>

                <button class="number-button">0</button>

                <button class="delete-key" id="deleteButton">
                    ⌫
                </button>

            </div>


            <!-- CONFIRMER -->

            <button class="pin-confirm" id="confirmButton">
                OK
            </button>


            <!-- RETOUR -->

            <button class="pin-cancel" id="cancelButton">
                ← Zurück
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
